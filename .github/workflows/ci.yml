name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/quality_check.py --release
      - name: Start Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Native scheduler lifecycle and actual trigger
        run: uv run pytest -q tests/integration
        env:
          RUN_NATIVE_TEST: '1'
          NATIVE_EVIDENCE_DIR: native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}
          path: native-evidence/
